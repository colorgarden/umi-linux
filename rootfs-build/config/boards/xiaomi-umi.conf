#
# Armbian board configuration — Xiaomi Mi 10 (umi)
#
# 目标：无头 Linux 小服务器（不要安卓）
# 用法：复制到 armbian/build 的 config/boards/xiaomi-umi.conf
#
# 依赖：Armbian 官方 sm8250 family（current = 6.18 LTS / edge = 6.19）
#       该 family 自带 qcom_pm8150b_charger 与 qcom_fg 的 out-of-tree 补丁，
#       电池功能依赖它们，所以不要换到别的 family。
#

# 生成可通过 Qualcomm ABL 引导的 kernel + rootfs 镜像
declare -g BOARD_NAME="Xiaomi Mi 10"
declare -g BOARD_MAINTAINER="mi10-port"
declare -g BOARDFAMILY="sm8250"
declare -g KERNEL_TARGET="current"          # sm8250 family 的 current = 6.18 LTS
declare -g EXTRAWIFI="no"                   # QCA6390 走内核自带 ath11k
declare -g MODULES="spi-geni-qcom"
declare -g BOOTCONFIG="none"
declare -g IMAGE_PARTITION_TABLE="gpt"
declare -g -a ABL_DTB_LIST=("sm8250-xiaomi-umi-csot" "sm8250-xiaomi-umi-sms")

# 内核 cmdline 追加：
#   clk_ignore_unused / pd_ignore_unused —— SM8250 手机必需
#   consoleblank=60 —— 60 秒无操作后控制台黑屏（AMOLED 黑 = 等效熄屏、零烧屏）
declare -g BOOTIMG_CMDLINE_EXTRA="clk_ignore_unused pd_ignore_unused consoleblank=60"

# 完整固件：linux-firmware + Armbian 自建固件包
# （含 qcom/a650_sqe.fw、qcom/sm8250/xiaomi/elish/* 的 GPU/Venus/DSP 固件）
declare -g BOARD_FIRMWARE_INSTALL="-full"

# 服务器向：禁用所有 sleep 模式（suspend/hibernate 在手机上不可靠）
declare -g POWER_MANAGEMENT_FEATURES="no"

function xiaomi-umi_is_userspace_supported() {
	[[ "${RELEASE}" == "trixie" ]] && return 0
	[[ "${RELEASE}" == "noble" ]] && return 0
	return 1
}

function post_family_tweaks_bsp__xiaomi-umi_bsp() {
	display_alert "$BOARD" "Install BSP files for Xiaomi Mi 10" "info"

	# USB Gadget 网络（RNDIS）—— 无头服务器场景的"有线网"，比 WiFi 稳
	mkdir -p $destination/usr/local/bin/
	mkdir -p $destination/usr/lib/systemd/system/
	install -Dm655 $SRC/packages/bsp/usb-gadget-network/setup-usbgadget-network.sh $destination/usr/local/bin/
	install -Dm655 $SRC/packages/bsp/usb-gadget-network/remove-usbgadget-network.sh $destination/usr/local/bin/
	install -Dm644 $SRC/packages/bsp/usb-gadget-network/usbgadget-rndis.service $destination/usr/lib/systemd/system/

	# 内核升级后自动用 mkbootimg 重建 ABL boot 镜像
	install -Dm655 $SRC/packages/bsp/xiaomi-umi/zz-update-abl-kernel $destination/etc/kernel/postinst.d/

	return 0
}

function post_family_tweaks__xiaomi-umi_enable_services() {
	if ! xiaomi-umi_is_userspace_supported; then
		if [[ "${RELEASE}" != "" ]]; then
			display_alert "Missing userspace for ${BOARD}" "${RELEASE} does not have the userspace necessary to support the ${BOARD}" "warn"
		fi
		return 0
	fi

	local aptdir="${SDCARD}/etc/apt/sources.list.d"
	local f

	# unudhcpd / mkbootimg 来自 armbian 仓库，需要临时打开。
	# ⚠️ 不同 Armbian 版本文件名不同：新版是 armbian.sources，老版是 armbian.list；
	#    而且只有 SKIP_ARMBIAN_REPO=yes 时才会被改名成 .disabled。
	#    所以这里两个名字都试，且文件不存在时不能报错（否则 set -e 会中断构建）。
	for f in "$aptdir"/armbian.sources.disabled "$aptdir"/armbian.list.disabled; do
		if [ -e "$f" ]; then
			mv "$f" "${f%.disabled}"
		fi
	done

	do_with_retries 3 chroot_sdcard_apt_get_update
	display_alert "$BOARD" "Installing board tweaks" "info"

	# 逐个安装：某个包在当前 release 里不存在时跳过，而不是让整个构建挂掉
	for pkg in qbootctl qrtr-tools unudhcpd mkbootimg device-tree-compiler \
	           protection-domain-mapper tqftpserv ; do
		do_with_retries 2 chroot_sdcard_apt_get_install "$pkg" \
			|| display_alert "Skipping package" "${pkg} 安装失败（该 release 可能没有），继续" "warn"
	done

	# 装完把 armbian 仓库关回去
	for f in "$aptdir"/armbian.sources "$aptdir"/armbian.list; do
		if [ -e "$f" ]; then
			mv "$f" "$f.disabled"
		fi
	done
	do_with_retries 3 chroot_sdcard_apt_get_update

	# 服务可能不存在（取决于上面哪些包装上了），失败不算错
	chroot_sdcard systemctl enable qbootctl.service || true
	chroot_sdcard systemctl enable usbgadget-rndis.service || true
	chroot_sdcard systemctl enable pd-mapper.service || true
	chroot_sdcard systemctl enable tqftpserv.service || true
	return 0
}

# 固件加入 initrd，保证 GPU / Venus 固件在早期就能加载
function post_family_tweaks_bsp__xiaomi-umi_bsp_firmware_in_initrd() {
	display_alert "Adding to bsp-cli" "${BOARD}: firmware in initrd" "info"
	declare file_added_to_bsp_destination
	add_file_from_stdin_to_bsp_destination "/etc/initramfs-tools/hooks/xiaomi-umi-firmware" <<- 'FIRMWARE_HOOK'
		#!/bin/bash
		[[ "$1" == "prereqs" ]] && exit 0
		. /usr/share/initramfs-tools/hook-functions
		# GPU zap shader（SM8250 通用）+ GPU 固件
		add_firmware "qcom/sm8250/a650_zap.mbn"
		add_firmware "qcom/a650_sqe.fw"
		add_firmware "qcom/a650_gmu.bin"
		# Venus 视频编解码
		for f in /lib/firmware/qcom/sm8250/xiaomi/elish/* ; do
			[ -e "$f" ] && add_firmware "${f#/lib/firmware/}"
		done
	FIRMWARE_HOOK
	run_host_command_logged chmod -v +x "${file_added_to_bsp_destination}"
}

function post_family_tweaks_bsp__xiaomi-umi_bsp_modules_in_initrd() {
	display_alert "Adding to bsp-cli" "${BOARD}: modules in initrd" "info"
	add_file_from_stdin_to_bsp_destination "/etc/initramfs-tools/modules" <<- 'EXTRA_MODULES'
		spi-geni-qcom
	EXTRA_MODULES
}
